name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'LeadMagic/leadmagic-mcp'
    environment: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main history and matching version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Inspect npm artifact without publishing
        run: npm pack --dry-run --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Release $GITHUB_REF_NAME"
